<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关系人格原型测试 · 8种会爱人的人格</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%239D6B7E'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23F6F1EE'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F1EE;
  --ink:#38302F;
  --rose:#9D6B7E;
  --rose-deep:#7E4F61;
  --sage:#7E9477;
  --card:#FFFFFF;
  --blush:#F0E4E1;
  --muted:#8A7C82;
  --line:#E7DDD8;
  --shadow:0 10px 30px rgba(86,60,70,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column;}
.view{display:none;flex:1;flex-direction:column;padding:28px 24px 40px;animation:fade .45s ease;}
.view.active{display:flex;}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.view{animation:none;}}

/* 封面 */
.cover-mark{width:64px;height:64px;border-radius:50%;background:var(--rose);display:flex;align-items:center;justify-content:center;margin:26px auto 22px;}
.cover-mark svg{width:32px;height:32px;}
.eyebrow{text-align:center;color:var(--rose);font-size:13px;letter-spacing:3px;margin-bottom:14px;}
h1{font-size:30px;line-height:1.35;text-align:center;font-weight:700;letter-spacing:.5px;}
.cover-sub{text-align:center;color:var(--muted);font-size:15px;margin-top:18px;}
.cover-meta{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:30px;box-shadow:var(--shadow);}
.cover-meta li{list-style:none;display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:#5c5055;padding:7px 0;}
.cover-meta li svg{width:18px;height:18px;flex:0 0 18px;margin-top:3px;color:var(--rose);}
.btn{display:block;width:100%;border:none;cursor:pointer;font-family:inherit;font-size:16.5px;font-weight:600;
  border-radius:999px;padding:16px;text-align:center;transition:transform .15s,background .2s;min-height:52px;}
.btn-primary{background:var(--rose);color:#fff;margin-top:26px;}
.btn-primary:active{background:var(--rose-deep);transform:scale(.98);}
.btn-ghost{background:transparent;color:var(--rose);border:1.5px solid var(--rose);margin-top:14px;}
.btn-ghost:active{background:var(--blush);}
.cover-foot{text-align:center;font-size:12px;color:var(--muted);margin-top:22px;}

/* 答题 */
.quiz-head{display:flex;align-items:center;gap:14px;}
.progress-track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--rose);border-radius:99px;transition:width .35s ease;}
.progress-num{font-size:13px;color:var(--muted);white-space:nowrap;}
.q-stage{flex:1;display:flex;flex-direction:column;justify-content:center;}
.q-text{font-size:21px;font-weight:600;line-height:1.55;margin:8px 0 30px;}
.opt{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);
  border-radius:16px;padding:16px 18px;margin-bottom:13px;cursor:pointer;font-size:16px;min-height:54px;transition:border .2s,background .2s;}
.opt:active{border-color:var(--rose);background:var(--blush);}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 20px;}
.opt:active .dot{border-color:var(--rose);}
.q-back{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;font-family:inherit;padding:6px;align-self:flex-start;min-height:36px;}
.q-hint{text-align:center;color:var(--sage);font-size:14px;margin-top:10px;}

/* 加载 */
.loading{flex:1;align-items:center;justify-content:center;text-align:center;gap:8px;}
.ring{width:54px;height:54px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--rose);
  animation:spin 1s linear infinite;margin-bottom:22px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{color:var(--muted);font-size:15px;}

/* 结果 */
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:center top;
  border:4px solid var(--card);box-shadow:0 8px 22px rgba(86,60,70,.18);display:block;margin:0 auto 18px;}
.result-badge{display:inline-block;align-self:center;background:var(--blush);color:var(--rose-deep);
  font-size:13px;letter-spacing:2px;padding:6px 16px;border-radius:999px;margin-bottom:18px;}
.result-title{font-size:26px;font-weight:700;text-align:center;line-height:1.4;}
.result-oneline{text-align:center;color:var(--muted);font-size:15px;margin-top:14px;}
.keywords{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
.keyword{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:14px;color:#5c5055;}
.quote{background:var(--rose);color:#fff;border-radius:18px;padding:22px 24px;margin-top:26px;font-size:16.5px;line-height:1.7;text-align:center;box-shadow:var(--shadow);}
.poster{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;margin-top:26px;box-shadow:var(--shadow);}
.poster .p-mark{width:40px;height:40px;border-radius:50%;background:var(--rose);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
.poster .p-mark svg{width:20px;height:20px;}
.poster h3{font-size:19px;text-align:center;line-height:1.5;}
.poster .p-kw{text-align:center;color:var(--muted);font-size:13px;margin-top:10px;}
.poster .p-q{text-align:center;font-size:14.5px;color:var(--rose-deep);margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);}
.poster .p-brand{text-align:center;font-size:12px;color:var(--muted);margin-top:16px;letter-spacing:1px;}

/* 付费墙 */
.pay-head{text-align:center;font-size:22px;font-weight:700;margin:6px 0 6px;}
.pay-sub{text-align:center;color:var(--muted);font-size:14.5px;margin-bottom:22px;}
.pay-list{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 20px;box-shadow:var(--shadow);}
.pay-list li{list-style:none;padding:13px 0;font-size:15px;display:flex;gap:12px;border-bottom:1px solid var(--line);}
.pay-list li:last-child{border-bottom:none;}
.pay-list li svg{width:19px;height:19px;flex:0 0 19px;color:var(--sage);margin-top:3px;}

/* 深度报告 */
.report-block{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px;box-shadow:var(--shadow);}
.report-block h4{font-size:16px;color:var(--rose-deep);margin-bottom:10px;display:flex;align-items:center;gap:9px;}
.report-block h4 svg{width:18px;height:18px;}
.report-block p{font-size:14.5px;color:#4d4348;}
.report-block .fit{padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px;}
.report-block .fit:last-child{border-bottom:none;}
.report-block .fit b{color:var(--rose-deep);}
.disclaimer{font-size:12px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.7;}
.report-view{align-items:center;}
.report-view > *{min-width:0;}
.report-view > .result-title,
.report-view > .report-block,
.report-view > .disclaimer,
.report-view > .btn{width:100%;margin-left:auto;margin-right:auto;}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(40,30,35,.45);display:none;align-items:center;justify-content:center;padding:28px;z-index:50;}
.modal-mask.show{display:flex;}
.modal{background:var(--card);border-radius:20px;padding:26px 22px;max-width:380px;width:100%;}
.modal h3{font-size:18px;text-align:center;margin-bottom:12px;}
.modal p{font-size:14px;color:#5c5055;margin-bottom:10px;}
.modal code{background:var(--blush);padding:2px 6px;border-radius:6px;font-size:13px;}
.code-input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:15px;font-family:inherit;margin:12px 0;min-height:48px;}
.code-input:focus{outline:none;border-color:var(--rose);}
</style>
</head>

/* ============ 状态 ============ */
const state={view:"cover",answers:[],current:0,result:null,unlocked:false};
const $app=document.getElementById("app");
const $mask=document.getElementById("modalMask");
const $box=document.getElementById("modalBox");

const iconHeart='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
const iconCheck='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const iconStar='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3 6.9 7.5.7-5.6 5 1.6 7.4L12 18.3 5.5 22l1.6-7.4-5.6-5 7.5-.7z"/></svg>';

/* ============ 计分与匹配 ============ */
function computeScores(){
  const dims={d1:[],d2:[],d3:[],d4:[]};
  QUESTIONS.forEach((q,i)=>{
    let v=state.answers[i];
    if(q.rev)v=6-v;
    dims[q.dim].push(v);
  });
  const score={};
  Object.keys(dims).forEach(k=>{score[k]=dims[k].reduce((a,b)=>a+b,0);});
  return score;
}
function matchType(score){
  const userVec=[score.d1,score.d2,score.d3,score.d4];
  let best=null,bestD=Infinity,second=null;
  TYPES.forEach(tp=>{
    let d=0;for(let i=0;i<4;i++)d+=Math.pow(userVec[i]-tp.vec[i],2);
    d=Math.sqrt(d);
    if(d<bestD){second=best;best=tp;bestD=d;}
    else if(!second||d<second.d){second={tp,d};}
  });
  return {best,second:second?second.tp:null};
}

/* ============ 渲染 ============ */
function render(){
  let html="";
  if(state.view==="cover")html=viewCover();
  else if(state.view==="quiz")html=viewQuiz();
  else if(state.view==="loading")html=viewLoading();
  else if(state.view==="result")html=viewResult();
  else if(state.view==="pay")html=viewPay();
  else if(state.view==="report")html=viewReport();
  $app.innerHTML=html;
  window.scrollTo(0,0);
}
function viewCover(){
  return '<div class="view active">'
  +'<div class="cover-mark">'+iconHeart+'</div>'
  +'<div class="eyebrow">关系人格原型</div>'
  +'<h1>成年人走散的真相：<br>这 8 种关系人格<br>第 3 种最让人心疼</h1>'
  +'<p class="cover-sub">看清你在友情、爱情等所有亲密关系里<br>那个反复出现的自己</p>'
  +'<ul class="cover-meta">'
  +'<li>'+iconCheck+'<span>28道情境题，凭直觉作答，约5分钟</span></li>'
  +'<li>'+iconCheck+'<span>基于依恋理论、高敏感与大五人格框架</span></li>'
  +'<li>'+iconCheck+'<span>答案无好坏，只有更懂自己的你</span></li>'
  +'</ul>'
  +'<button class="btn btn-primary" onclick="startQuiz()">开始测试</button>'
  +'<p class="cover-foot">作答仅用于生成你的结果，不做诊断，不构成医疗建议</p>'
  +'</div>';
}
function viewQuiz(){
  const i=state.current,q=QUESTIONS[i];
  const pct=Math.round((i)/QUESTIONS.length*100);
  let opts=OPTIONS.map((label,idx)=>'<div class="opt" onclick="answer('+(idx+1)+')"><span class="dot"></span><span>'+label+'</span></div>').join("");
  let back=i>0?'<button class="q-back" onclick="prevQ()">‹ 上一题</button>':'';
  let hint=(i===14)?'<p class="q-hint">已经一半啦，真实的你正在浮现</p>':'';
  return '<div class="view active">'
  +'<div class="quiz-head"><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
  +'<span class="progress-num">第'+(i+1)+'/'+QUESTIONS.length+'题</span></div>'
  +'<div class="q-stage">'+back+'<p class="q-text">'+q.t+'</p>'+opts+hint+'</div>'
  +'</div>';
}
function viewLoading(){
  return '<div class="view active loading"><div class="ring"></div><p>正在生成你的关系人格…</p></div>';
}
function viewResult(){
  const tp=state.result.best;
  let kw=tp.keywords.map(k=>'<span class="keyword">'+k+'</span>').join("");
  return '<div class="view active">'
  +'<img class="avatar" src="'+tp.img+'" alt="'+tp.ref+'">'
  +'<span class="result-badge">你的关系人格</span>'
  +'<h2 class="result-title">'+tp.name+'</h2>'
  +'<p class="result-oneline">'+tp.oneline+'</p>'
  +'<div class="keywords">'+kw+'</div>'
  +'<div class="quote">“'+tp.quote+'”</div>'
  +'<div class="poster"><div class="p-mark">'+iconStar+'</div><h3>'+tp.name+'</h3>'
  +'<p class="p-kw">'+tp.keywords.join(' · ')+'</p>'
  +'<p class="p-q">“'+tp.quote+'”</p>'
  +'<p class="p-brand">关系人格原型测试</p></div>'
  +'<button class="btn btn-primary" onclick="goPay()">解锁完整的我</button>'
  +'<button class="btn btn-ghost" onclick="restart()">重新测一次</button>'
  +'</div>';
}
function viewPay(){
  const list=PAY_POINTS.map(p=>'<li>'+iconCheck+'<span>'+p+'</span></li>').join("");
  return '<div class="view active">'
  +'<h2 class="pay-head">你的完整关系人格<br>藏在这3个盲区里</h2>'
  +'<p class="pay-sub">你已经看到了表面的自己，完整版会告诉你</p>'
  +'<ul class="pay-list">'+list+'</ul>'
  +'<button class="btn btn-primary" onclick="unlock()">解锁完整报告</button>'
  +'<button class="btn btn-ghost" onclick="state.view=\'result\';render()">返回结果</button>'
  +'</div>';
}
function viewReport(){
  const tp=state.result.best;
  let blocks='';
  blocks+=block('核心特质',tp.trait);
  blocks+=block('关系行为模式',tp.pattern);
  blocks+=block('阴影面与情绪盲区',tp.shadow);
  blocks+=block('成长建议',tp.growth);
  let fits=tp.fit.map(f=>'<div class="fit">'+f+'</div>').join("");
  return '<div class="view active report-view">'
  +'<img class="avatar" src="'+tp.img+'" alt="'+tp.ref+'">'
  +'<span class="result-badge">完整报告</span>'
  +'<h2 class="result-title">'+tp.name+'</h2>'
  +blocks
  +'<div class="report-block"><h4>'+iconStar+'关系适配</h4>'+fits+'</div>'
  +'<p class="disclaimer">本测试为自我探索工具，基于依恋理论、高敏感与大五人格等框架，非心理诊断，不构成医疗建议。</p>'
  +'<button class="btn btn-ghost" onclick="restart()">重新测一次</button>'
  +'</div>';
}
function block(title,content){
  return '<div class="report-block"><h4>'+iconStar+title+'</h4><p>'+content+'</p></div>';
}

/* ============ 事件 ============ */
function startQuiz(){state.answers=[];state.current=0;state.view="quiz";render();}
function answer(v){
  state.answers[state.current]=v;
  if(state.current<QUESTIONS.length-1){state.current++;render();}
  else{state.view="loading";render();setTimeout(()=>{
    const score=computeScores();
    state.result=matchType(score);
    state.view="result";render();
  },2200);}
}
function prevQ(){if(state.current>0){state.current--;render();}}
function restart(){state.view="cover";state.answers=[];state.current=0;state.unlocked=false;render();}
function goPay(){state.view="pay";render();}
function unlock(){
  $box.innerHTML='<h3>输入兑换码解锁</h3>'
  +'<p style="text-align:center;">完成购买后，将获得的兑换码输入下方，即可查看完整报告。</p>'
  +'<input class="code-input" id="codeInput" placeholder="请输入兑换码" autocomplete="off">'
  +'<button class="btn btn-primary" onclick="submitCode()">提交并解锁</button>';
  $mask.classList.add("show");
  setTimeout(function(){var el=document.getElementById("codeInput");if(el)el.focus();},80);
}
function submitCode(){
  const input=document.getElementById("codeInput");
  const val=(input.value||"").trim().toUpperCase();
  if(val==="LOVE2026"){closeModal();state.unlocked=true;state.view="report";render();}
  else{
    input.style.borderColor="#c0566b";
    let tip=document.getElementById("codeErr");
    if(!tip){
      tip=document.createElement("p");
      tip.id="codeErr";
      tip.style.cssText="color:#c0566b;font-size:13px;margin:2px 0 0;text-align:center;";
      input.parentNode.insertBefore(tip,input.nextSibling);
    }
    tip.textContent="兑换码无效，请核对后重新输入";
    input.focus();
  }
}
function closeModal(){$mask.classList.remove("show");}
$mask.addEventListener("click",e=>{if(e.target===$mask){closeModal();}});

const PAY_POINTS=[
  "你在亲密关系里反复踩的那个坑，是怎么形成的",
  "你和哪种人最合拍、和哪种人注定互相消耗（8型配对图鉴）",
  "压力状态下你的隐藏人格，以及3条能立刻用上的成长建议"
];

render();
</script>
